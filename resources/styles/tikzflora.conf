# Style: tikzflora
# All paths are relative to the project root; build scripts resolve them to
# absolute paths before invoking pandoc. See README.md in this directory.
TEMPLATE=resources/styles/tikzflora.latex

# Directories appended to TEXINPUTS so LuaLaTeX can find tikzflora.sty and
# tikzflora-boot.lua while pandoc compiles in a temporary directory.
TEXINPUTS=resources/vendor/tikzflora

# Extra environment variables (ENV_<NAME>=<path-relative-to-project-root>).
# tikzflora-boot.lua probes $FLORA_LUA first when locating lua/flora/*.lua.
ENV_FLORA_LUA=resources/vendor/tikzflora/lua

# Style-specific Lua filters, whitespace separated and resolved to absolute
# paths by the build scripts. flora.lua maps Front Matter flora-* keys to
# \florasetup without pandoc's LaTeX escaping.
LUA_FILTERS=resources/flora.lua

# Extra pandoc arguments, whitespace separated (no arguments needed here).
PANDOC_ARGS=
